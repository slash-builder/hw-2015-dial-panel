# The Raspberry Pi OS release Dial OS is built from.
#
# Pinned on purpose. A build that silently tracks "latest" is a build you
# cannot reproduce when someone reports a bug against an image you shipped
# three months ago. Bumping this is a commit, with a checksum, like any other
# dependency.
#
# Verify a bump against the release directory, not against a mirror:
#   https://downloads.raspberrypi.com/raspios_lite_arm64/images/

