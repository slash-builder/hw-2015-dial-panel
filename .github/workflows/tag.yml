name: Tag

# Every commit that lands on main gets a version tag, so a printed part can
# always be traced back to the exact geometry it came from. Patch only --
# bump the minor or major by hand (push a tag like v0.2.0) when a release
# means something, and this picks up from there.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the next patch version
        run: |
          set -euo pipefail

          pattern='v[0-9]*.[0-9]*.[0-9]*'

          existing=$(git tag --points-at HEAD --list "$pattern" | head -n 1)
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing - nothing to do."
            exit 0
          fi

          latest=$(git tag --list "$pattern" --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            version=${latest#v}
            major=${version%%.*}
            rest=${version#*.}
            minor=${rest%%.*}
            patch=${rest##*.}
            next="v${major}.${minor}.$((patch + 1))"
          fi

          subject=$(git log -1 --pretty=%s)

          echo "previous: ${latest:-none}"
          echo "next:     $next"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next - $subject"
          git push origin "$next"

          echo "Tagged \`$next\` - $subject" >> "$GITHUB_STEP_SUMMARY"
