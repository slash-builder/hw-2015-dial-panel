<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d"><title id="t">Audio wiring</title><desc id="d">How the MAX98357A amplifier and the speaker connect to the Raspberry Pi.</desc><rect width="1100" height="680" fill="#05060C"/><text x="40" y="46" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="2">DIAL PANEL · WIRING</text><text x="40" y="80" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="26" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">2 · AMP AND SPEAKER (MAX98357A)</text><rect x="60" y="150" width="150" height="220" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="74" y="176" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">PI 5 HEADER</text><circle cx="210" cy="210" r="5.5" fill="#FF2A3C" stroke="#05060C" stroke-width="1.5"/><text x="194" y="214" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">4  5V</text><circle cx="210" cy="244" r="5.5" fill="#6E7894" stroke="#05060C" stroke-width="1.5"/><text x="194" y="248" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">39  GND</text><circle cx="210" cy="278" r="5.5" fill="#9E6BFF" stroke="#05060C" stroke-width="1.5"/><text x="194" y="282" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">12  GPIO18</text><circle cx="210" cy="312" r="5.5" fill="#9E6BFF" stroke="#05060C" stroke-width="1.5"/><text x="194" y="316" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">35  GPIO19</text><circle cx="210" cy="346" r="5.5" fill="#9E6BFF" stroke="#05060C" stroke-width="1.5"/><text x="194" y="350" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">40  GPIO21</text><rect x="640" y="150" width="230" height="260" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="654" y="176" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">MAX98357A</text><text x="654" y="196" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">I2S mono amp</text><circle cx="640" cy="222.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="226.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Vin</text><circle cx="640" cy="248.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="252.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">GND</text><circle cx="640" cy="274.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="278.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">BCLK</text><circle cx="640" cy="300.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="304.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">LRC</text><circle cx="640" cy="326.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="330.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">DIN</text><circle cx="640" cy="352.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="356.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">SD</text><circle cx="640" cy="378.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="654" y="382.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">GAIN</text><path d="M210 210 L470 210 L470 222.0 L640 222.0" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 244 L470 244 L470 248.0 L640 248.0" fill="none" stroke="#6E7894" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 278 L470 278 L470 274.0 L640 274.0" fill="none" stroke="#9E6BFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 312 L470 312 L470 300.0 L640 300.0" fill="none" stroke="#9E6BFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 346 L470 346 L470 326.0 L640 326.0" fill="none" stroke="#9E6BFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="900" y="250" width="150" height="110" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="914" y="276" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">SPEAKER</text><text x="914" y="296" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">40 mm · 4 Ω</text><path d="M870 300 L900 300" fill="none" stroke="#E6E9F1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M870 330 L900 330" fill="none" stroke="#6E7894" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="884" y="292" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">+</text><text x="884" y="346" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">−</text><rect x="60" y="440" width="520" height="110" rx="8" fill="#0A0C16" stroke="#F5C842" stroke-width="1.2"/><text x="74" y="462" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#F5C842" text-anchor="start" font-weight="400" letter-spacing="1.5">DO NOT WIRE THESE</text><text x="74" y="482" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Leave SD and GAIN unconnected.</text><text x="74" y="502" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">SD is held high on the board by a 1 MΩ resistor, so wiring it</text><text x="74" y="522" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">to a GPIO is a common way to end up with silence. GAIN</text><text x="74" y="542" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">unconnected = 9 dB, which is right for this speaker.</text><rect x="620" y="440" width="430" height="90" rx="8" fill="#0A0C16" stroke="#6E7894" stroke-width="1.2"/><text x="634" y="462" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.5">NOTES</text><text x="634" y="482" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">The amp needs headers soldered on,</text><text x="634" y="502" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">unless you bought a pre-soldered one.</text><text x="634" y="522" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Speaker polarity doesn't matter for one speaker.</text></svg>