<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="t d"><title id="t">Wiring overview</title><desc id="d">What connects to what in the Dial Panel.</desc><rect width="1180" height="720" fill="#05060C"/><text x="40" y="46" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="2">DIAL PANEL · WIRING</text><text x="40" y="80" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="26" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">OVERVIEW</text><rect x="470" y="300" width="240" height="180" rx="10" fill="#101426" stroke="#222842" stroke-width="1.6"/><text x="590" y="340" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="17" fill="#E6E9F1" text-anchor="middle" font-weight="800" letter-spacing="0">RASPBERRY PI 5</text><text x="590" y="364" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#6E7894" text-anchor="middle" font-weight="400" letter-spacing="0">40-pin header</text><text x="590" y="396" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#9AA3BA" text-anchor="middle" font-weight="400" letter-spacing="0">+ USB-C power in</text><text x="590" y="418" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#9AA3BA" text-anchor="middle" font-weight="400" letter-spacing="0">+ display ribbon</text><rect x="110" y="150" width="240" height="90" rx="10" fill="#0A0C16" stroke="#FF2A3C" stroke-width="1.4"/><text x="126" y="184" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">TOUCH DISPLAY 2</text><text x="126" y="208" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">ribbon + 5 V/GND on pins 2, 6</text><path d="M350 195 L410 195 L410 360 L470 360" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="300" width="240" height="90" rx="10" fill="#0A0C16" stroke="#22E8E0" stroke-width="1.4"/><text x="126" y="334" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">DIAL (KY-040)</text><text x="126" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">3V3, GND, GPIO17/27/22</text><path d="M350 345 L410 345 L410 360 L470 360" fill="none" stroke="#22E8E0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="450" width="240" height="90" rx="10" fill="#0A0C16" stroke="#F5C842" stroke-width="1.4"/><text x="126" y="484" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">MIC + ROCKER</text><text x="126" y="508" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">USB, with the rocker in VBUS</text><path d="M350 495 L410 495 L410 360 L470 360" fill="none" stroke="#F5C842" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="150" width="240" height="90" rx="10" fill="#0A0C16" stroke="#9E6BFF" stroke-width="1.4"/><text x="846" y="184" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">AMP + SPEAKER</text><text x="846" y="208" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">5 V, GND, GPIO18/19/21</text><path d="M830 195 L770 195 L770 360 L710 360" fill="none" stroke="#9E6BFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="300" width="240" height="90" rx="10" fill="#0A0C16" stroke="#3FD07A" stroke-width="1.4"/><text x="846" y="334" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">LED STRIPS</text><text x="846" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">5 V, GND, GPIO10 via buffer</text><path d="M830 345 L770 345 L770 360 L710 360" fill="none" stroke="#3FD07A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="830" y="450" width="240" height="90" rx="10" fill="#0A0C16" stroke="#FF2A3C" stroke-width="1.4"/><text x="846" y="484" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">USB-C POWER</text><text x="846" y="508" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">27 W supply, straight plug</text><path d="M830 495 L770 495 L770 360 L710 360" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="570" width="960" height="70" rx="8" fill="#0A0C16" stroke="#6E7894" stroke-width="1.2"/><text x="124" y="592" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.5">AT A GLANCE</text><text x="124" y="612" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Everything runs from the Pi's own 27 W supply. Nothing else needs power.</text><text x="124" y="632" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Full pin list: header-map.svg. Then wire each subsystem: encoder, audio, leds, mic-cut.</text></svg>