<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-labelledby="t d"><title id="t">Mic cut wiring</title><desc id="d">How the rocker switch is spliced into the microphone's USB power wire.</desc><rect width="1100" height="700" fill="#05060C"/><text x="40" y="46" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="2">DIAL PANEL · WIRING</text><text x="40" y="80" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="26" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">4 · THE MIC CUT (ONE SPLICE)</text><text x="40" y="112" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">The rocker breaks the microphone's power. Off means the Pi cannot see the mic at all — no software can turn it back on.</text><rect x="60" y="226" width="980" height="150" rx="10" fill="#0A0C16" stroke="#171C33" stroke-width="1.2"/><text x="78" y="248" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.2">USB-A EXTENSION, JACKET OPENED ABOUT 10 CM FROM THE FEMALE END</text><text x="78" y="392" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">MALE END -&gt; PI USB PORT</text><text x="1022" y="392" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="end" font-weight="400" letter-spacing="0">FEMALE END -&gt; MIC</text><path d="M100 274 L470 274" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 274 L1000 274" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="260" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#FF2A3C" text-anchor="middle" font-weight="400" letter-spacing="0">CUT HERE</text><text x="110" y="266" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">RED  +5 V (VBUS)</text><path d="M100 296 L1000 296" fill="none" stroke="#E6E9F1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="288" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">WHITE  D−</text><path d="M100 318 L1000 318" fill="none" stroke="#3FD07A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="310" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">GREEN  D+</text><path d="M100 340 L1000 340" fill="none" stroke="#6E7894" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="332" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">BLACK  GND</text><rect x="480" y="420" width="140" height="90" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="550" y="452" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="14" fill="#E6E9F1" text-anchor="middle" font-weight="800" letter-spacing="0">ROCKER</text><text x="550" y="472" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="middle" font-weight="400" letter-spacing="0">KCD1 · 2 pin</text><path d="M470 274 L470 360 L505 360 L505 420" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M630 274 L630 360 L595 360 L595 420" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="545" width="470" height="130" rx="8" fill="#0A0C16" stroke="#6E7894" stroke-width="1.2"/><text x="74" y="567" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.5">STEPS</text><text x="74" y="587" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">1. Cut ONLY the red wire.</text><text x="74" y="607" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">2. Strip both ends about 5 mm.</text><text x="74" y="627" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">3. Slide heat-shrink on BEFORE soldering.</text><text x="74" y="647" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">4. Solder one end to each rocker terminal.</text><text x="74" y="667" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">5. Shrink the tubing over each joint.</text><rect x="570" y="545" width="470" height="130" rx="8" fill="#0A0C16" stroke="#FF2A3C" stroke-width="1.2"/><text x="584" y="567" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#FF2A3C" text-anchor="start" font-weight="400" letter-spacing="1.5">CAREFUL</text><text x="584" y="587" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Leave white, green and black untouched.</text><text x="584" y="607" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Cutting a data wire kills the microphone;</text><text x="584" y="627" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">cutting the shield can cause noise.</text><text x="584" y="647" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Check with the Pi off, then boot and run</text><text x="584" y="667" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">arecord -l with the rocker on and off.</text></svg>