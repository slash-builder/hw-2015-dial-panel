<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="t d"><title id="t">Dial wiring</title><desc id="d">How the KY-040 rotary encoder connects to the Raspberry Pi header.</desc><rect width="1100" height="620" fill="#05060C"/><text x="40" y="46" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="2">DIAL PANEL · WIRING</text><text x="40" y="80" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="26" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">1 · THE DIAL (KY-040)</text><rect x="60" y="150" width="150" height="250" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="74" y="176" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">PI 5 HEADER</text><circle cx="210" cy="210" r="5.5" fill="#FF7A1A" stroke="#05060C" stroke-width="1.5"/><text x="194" y="214" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">1  3V3</text><circle cx="210" cy="244" r="5.5" fill="#6E7894" stroke="#05060C" stroke-width="1.5"/><text x="194" y="248" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">9  GND</text><circle cx="210" cy="278" r="5.5" fill="#22E8E0" stroke="#05060C" stroke-width="1.5"/><text x="194" y="282" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">11  GPIO17</text><circle cx="210" cy="312" r="5.5" fill="#22E8E0" stroke="#05060C" stroke-width="1.5"/><text x="194" y="316" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">13  GPIO27</text><circle cx="210" cy="346" r="5.5" fill="#F5C842" stroke="#05060C" stroke-width="1.5"/><text x="194" y="350" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">15  GPIO22</text><rect x="700" y="150" width="250" height="250" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="714" y="176" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">KY-040</text><text x="714" y="196" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">rotary encoder + push</text><circle cx="700" cy="222" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="714" y="226" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">+</text><circle cx="700" cy="252" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="714" y="256" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">GND</text><circle cx="700" cy="282" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="714" y="286" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">CLK</text><circle cx="700" cy="312" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="714" y="316" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">DT</text><circle cx="700" cy="342" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="714" y="346" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">SW</text><path d="M210 210 L500 210 L500 222 L700 222" fill="none" stroke="#FF7A1A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 244 L500 244 L500 252 L700 252" fill="none" stroke="#6E7894" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 278 L500 278 L500 282 L700 282" fill="none" stroke="#22E8E0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 312 L500 312 L500 312 L700 312" fill="none" stroke="#22E8E0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 346 L500 346 L500 342 L700 342" fill="none" stroke="#F5C842" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="430" width="480" height="70" rx="8" fill="#0A0C16" stroke="#FF2A3C" stroke-width="1.2"/><text x="74" y="452" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#FF2A3C" text-anchor="start" font-weight="400" letter-spacing="1.5">NOTE</text><text x="74" y="472" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">+ goes to pin 1 (3.3 V). Never 5 V.</text><text x="74" y="492" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Five female-female jumpers, no soldering.</text><rect x="580" y="430" width="460" height="90" rx="8" fill="#0A0C16" stroke="#6E7894" stroke-width="1.2"/><text x="594" y="452" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.5">IF IT FEELS BACKWARDS</text><text x="594" y="472" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Turning sends steps; pressing sends Enter.</text><text x="594" y="492" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">CLK/DT swapped just reverses direction —</text><text x="594" y="512" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">swap the two wires, or the pins in config.txt.</text></svg>