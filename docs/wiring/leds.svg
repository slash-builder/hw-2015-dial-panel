<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" role="img" aria-labelledby="t d"><title id="t">LED wiring</title><desc id="d">How the WS2812B strips connect through a level shifter to the Raspberry Pi.</desc><rect width="1240" height="800" fill="#05060C"/><text x="40" y="46" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="2">DIAL PANEL · WIRING</text><text x="40" y="80" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="26" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">3 · THE LIGHT (WS2812B)</text><rect x="60" y="160" width="150" height="180" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="74" y="186" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">PI 5 HEADER</text><circle cx="210" cy="220" r="5.5" fill="#FF2A3C" stroke="#05060C" stroke-width="1.5"/><text x="194" y="224" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">4  5V</text><circle cx="210" cy="254" r="5.5" fill="#6E7894" stroke="#05060C" stroke-width="1.5"/><text x="194" y="258" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">34  GND</text><circle cx="210" cy="288" r="5.5" fill="#3FD07A" stroke="#05060C" stroke-width="1.5"/><text x="194" y="292" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">19  GPIO10</text><rect x="430" y="160" width="250" height="230" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="444" y="186" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">74AHCT125</text><text x="444" y="206" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">3.3 V -&gt; 5 V buffer</text><circle cx="680" cy="232" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="666" y="236" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">14 VCC</text><circle cx="680" cy="262" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="666" y="266" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">7 GND</text><circle cx="680" cy="292" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="666" y="296" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">1 OE1 -&gt; GND</text><circle cx="680" cy="322" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="666" y="326" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">2 1A (in)</text><circle cx="680" cy="352" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="666" y="356" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="end" font-weight="400" letter-spacing="0">3 1Y (out)</text><rect x="940" y="150" width="230" height="120" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="954" y="176" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">BAND STRIP</text><text x="954" y="196" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">~12 LEDs, forward</text><circle cx="940" cy="222.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="226.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">DIN</text><circle cx="940" cy="236.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="240.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">5V</text><circle cx="940" cy="250.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="254.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">GND</text><rect x="940" y="320" width="230" height="120" rx="8" fill="#101426" stroke="#222842" stroke-width="1.4"/><text x="954" y="346" font-family="'Archivo', 'Archivo Black', Arial, sans-serif" font-size="15" fill="#E6E9F1" text-anchor="start" font-weight="800" letter-spacing="0">WALL WASH</text><text x="954" y="366" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">~40 LEDs, rearward</text><circle cx="940" cy="392.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="396.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">DIN</text><circle cx="940" cy="406.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="410.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">5V</text><circle cx="940" cy="420.0" r="4.5" fill="#4C5573" stroke="#05060C" stroke-width="1.5"/><text x="954" y="424.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">GND</text><path d="M210 288 L330 288 L330 322 L680 322" fill="none" stroke="#3FD07A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 352 L760 352" fill="none" stroke="#3FD07A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="760" y="337" width="84" height="30" rx="6" fill="#101426" stroke="#222842" stroke-width="1.2"/><text x="802" y="357" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12.5" fill="#C6CCDB" text-anchor="middle" font-weight="400" letter-spacing="0">330 Ω</text><path d="M844 352 L890 352 L890 222.0 L940 222.0" fill="none" stroke="#3FD07A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M890 222.0 L890 392.0 L940 392.0" fill="none" stroke="#3FD07A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="700" y="396.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="0">band DOUT -&gt; wash DIN</text><path d="M680 292 L712 292 L712 262 L680 262" fill="none" stroke="#6E7894" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 220 L250 220 L250 560 L906 560 L906 236.0 L940 236.0" fill="none" stroke="#FF2A3C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M906 560 L906 406.0 L940 406.0" fill="none" stroke="#FF2A3C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 254 L215 254 L215 600 L924 600 L924 250.0 L940 250.0" fill="none" stroke="#6E7894" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M924 600 L924 420.0 L940 420.0" fill="none" stroke="#6E7894" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 220 L300 220 L300 232 L680 232" fill="none" stroke="#FF2A3C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M210 254 L272 254 L272 262 L680 262" fill="none" stroke="#6E7894" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="552" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#FF2A3C" text-anchor="start" font-weight="400" letter-spacing="0">5 V to both strips</text><text x="300" y="618" font-family="'IBM Plex Mono', Menlo, monospace" font-size="12" fill="#9AA3BA" text-anchor="start" font-weight="400" letter-spacing="0">GND to both strips</text><rect x="60" y="640" width="560" height="70" rx="8" fill="#0A0C16" stroke="#6E7894" stroke-width="1.2"/><text x="74" y="662" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#6E7894" text-anchor="start" font-weight="400" letter-spacing="1.5">DIRECTION MATTERS</text><text x="74" y="682" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Strips have a direction: wire into the DIN end.</text><text x="74" y="702" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Chain them: band DOUT -&gt; wash DIN. Cut only on pads.</text><rect x="650" y="640" width="530" height="90" rx="8" fill="#0A0C16" stroke="#FF2A3C" stroke-width="1.2"/><text x="664" y="662" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#FF2A3C" text-anchor="start" font-weight="400" letter-spacing="1.5">POWER</text><text x="664" y="682" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Brightness stays capped (config.txt: 64/255).</text><text x="664" y="702" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">52 LEDs at full white would pull ~3 A, more than the</text><text x="664" y="722" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Pi's 5 V pins can give. Solder the 5 V split.</text><rect x="60" y="750" width="1120" height="70" rx="8" fill="#0A0C16" stroke="#F5C842" stroke-width="1.2"/><text x="74" y="772" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" fill="#F5C842" text-anchor="start" font-weight="400" letter-spacing="1.5">OPTIONAL</text><text x="74" y="792" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">The shifter is recommended, not required: WS2812Bs want a data high near 5 V and the Pi gives 3.3 V.</text><text x="74" y="812" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#C6CCDB" text-anchor="start" font-weight="400" letter-spacing="0">Try without it (GPIO10 straight to the resistor); add it if the LEDs flicker or show wrong colours.</text></svg>